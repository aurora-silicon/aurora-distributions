name: Build the native developer installer
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Immutable native-dev-YYYYMMDD tag to prepare
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  catalogs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check signing and profile isolation
        run: python3 -m unittest discover -s tests -p 'test_native_*.py'
      - name: Prepare the signed app download metadata
        env:
          SIGNING_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/catalog-key.pem"
          trap 'rm -f "$key"' EXIT
          python3 - "$key" <<'PY'
          import os,sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(os.environ['SIGNING_KEY'])
          PY
          python3 scripts/prepare-native-release-inputs.py \
            --source site/installer --output "$RUNNER_TEMP/native-catalogs" \
            --signing-key "$key" --tag "$RELEASE_TAG" --source-revision "$GITHUB_SHA"
          tar -czf "$RUNNER_TEMP/native-catalogs.tar.gz" -C "$RUNNER_TEMP/native-catalogs" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-native-catalogs
          path: ${{ runner.temp }}/native-catalogs.tar.gz
          retention-days: 30
  macos:
    needs: catalogs
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEBUILDMCP_SENTRY_DISABLED: 'true'
      NATIVE_REVISION: 6dca86b6faf5a5387b09d6df1aad887266837bc6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: delivery
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aurora-silicon/aurora-installer
          ref: ${{ env.NATIVE_REVISION }}
          persist-credentials: false
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: signed-native-catalogs
          path: ${{ runner.temp }}/catalog-inputs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Record native build tools and prepare all nine profiles
        working-directory: installer/macOS
        run: |
          set -euo pipefail
          [[ $(uname -m) == arm64 ]]
          mkdir -p "$RUNNER_TEMP/native-output" "$RUNNER_TEMP/native-catalogs"
          {
            git rev-parse HEAD
            sw_vers
            xcodebuild -version
            df -k "$RUNNER_TEMP"
          } > "$RUNNER_TEMP/native-output/toolchain.txt"
          tar -xzf "$RUNNER_TEMP/catalog-inputs/native-catalogs.tar.gz" -C "$RUNNER_TEMP/native-catalogs"
          python3 scripts/prepare-distribution-release.py \
            --profiles "$RUNNER_TEMP/native-catalogs/Profiles" --output "$RUNNER_TEMP/release" --sealed
      - name: Authenticate the pinned engine and Recovery template
        working-directory: installer/macOS
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/native-runtime"
          mkdir -p "$runtime" Engine/artifacts
          base=https://github.com/aurora-silicon/aurora-installer/releases/download/native-runtime-v0.9.2-aurora.2
          for name in runtime-manifest.json runtime-manifest.json.sig installer-v0.9.2-aurora.2.tar.gz aurora-recovery-template-20261018.tar.gz; do
            curl --fail --location --silent --show-error --retry 3 "$base/$name" --output "$runtime/$name"
          done
          swift scripts/catalog-signing.swift verify Release/trust-root.ed25519.pub \
            "$runtime/runtime-manifest.json" "$runtime/runtime-manifest.json.sig"
          python3 "$GITHUB_WORKSPACE/delivery/scripts/verify-native-runtime.py" \
            --runtime "$runtime" --checkout "$GITHUB_WORKSPACE/installer" \
            > "$RUNNER_TEMP/native-output/runtime-identity.json"
          cp "$runtime/installer-v0.9.2-aurora.2.tar.gz" Engine/artifacts/
          mkdir "$runtime/recovery"
          tar -xzf "$runtime/aurora-recovery-template-20261018.tar.gz" -C "$runtime/recovery"
          cp "$runtime/runtime-manifest.json" "$runtime/runtime-manifest.json.sig" "$RUNNER_TEMP/native-output/"
      - name: Install the pinned native build tool
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/xcodebuildmcp"
          mkdir "$tool"
          archive=xcodebuildmcp-2.7.0-darwin-arm64.tar.gz
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/getsentry/XcodeBuildMCP/releases/download/v2.7.0/$archive" --output "$tool/$archive"
          echo "bd724a2c0e6ffe027b3f46257e66d626149a64cd045f4867124bd683b3cf081a  $tool/$archive" | shasum -a 256 -c -
          tar -xzf "$tool/$archive" -C "$tool"
          echo "$tool/xcodebuildmcp-2.7.0-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Build and package the explicit developer app
        working-directory: installer/macOS
        run: |
          set -euo pipefail
          xcodebuildmcp swift-package build --package-path "$PWD" --configuration release
          OMARCHY_DEVELOPER_BUILD=1 OMARCHY_APP_VERSION=2.1.1 OMARCHY_BUILD_JOBS=2 \
            OMARCHY_RECOVERY_TEMPLATE="$RUNNER_TEMP/native-runtime/recovery/Aurora Installer.app" \
            bash Packaging/build-app.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/native-app"
          app="$RUNNER_TEMP/native-app/Aurora Installer.app"
          codesign --verify --deep --strict "$app"
          [[ $(lipo -archs "$app/Contents/MacOS/OmarchyAppleInstallerApp") == arm64 ]]
          package="$RUNNER_TEMP/native-output/Aurora-Installer-2.1.1-Developer.pkg"
          bash Packaging/build-developer-pkg.sh "$app" "$package"
          bash test/macos-developer-peer-binding.sh "$app" "$package" \
            2>&1 | tee "$RUNNER_TEMP/native-output/helper-peer-binding.log"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/native-output/Aurora-Installer-2.1.1-Developer.zip"
          cp "$RUNNER_TEMP/release/profile-manifest.json" "$RUNNER_TEMP/native-output/"
          cp "$RUNNER_TEMP/catalog-inputs/native-catalogs.tar.gz" "$RUNNER_TEMP/native-output/"
          export APP_PATH="$app"
          python3 - "$RUNNER_TEMP/native-output" <<'PY'
          from pathlib import Path
          import hashlib,json,os,plistlib,subprocess,sys
          out=Path(sys.argv[1]);app=Path(os.environ['APP_PATH'])
          info=plistlib.loads((app/'Contents/Info.plist').read_bytes())
          assert info['OmarchyDeveloperBuild'] is True
          profiles=app/'Contents/Resources/Release/Profiles'
          assert len(list(profiles.iterdir()))==9
          records={}
          for path in sorted(out.iterdir()):
              if path.is_file():
                  with path.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
                  records[path.name]={'bytes':path.stat().st_size,'sha256':digest}
          manifest={'schema':1,'native_revision':os.environ['NATIVE_REVISION'],'delivery_revision':os.environ['GITHUB_SHA'],
              'workflow_run':os.environ['GITHUB_RUN_ID'],'app_version':info['CFBundleShortVersionString'],
              'app_build':info['CFBundleVersion'],'signing':'ad-hoc','notarized':False,
              'helper_authentication':'identifier-and-exact-cdhash','peer_binding_test':'passed','assets':records}
          (out/'native-build.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-developer-installer
          path: ${{ runner.temp }}/native-output/
          retention-days: 30
