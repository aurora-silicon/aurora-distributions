name: Adopt a verified distribution delivery set
on:
  workflow_dispatch:
    inputs:
      deliveries:
        description: JSON array of repository and tag objects
        required: true
      model-cohort:
        description: Adopt the complete 58-model set and manifest atomically
        type: choice
        options: [current, models58]
        default: current
permissions:
  contents: write
  actions: write
  attestations: read
concurrency:
  group: distribution-profile-adoption
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  adopt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify the complete selected delivery set
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERIES: ${{ inputs.deliveries }}
          MODEL_COHORT: ${{ inputs.model-cohort || 'current' }}
        run: |
          python3 scripts/adopt-set.py --deliveries "$DELIVERIES" --model-cohort "$MODEL_COHORT"
      - name: Record the authenticated resource tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site keys/supported-models.json
          if ! git diff --cached --quiet; then
            git commit -m 'Adopt verified distribution delivery set'
            git push
          fi
      - name: Publish the verified profile tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
