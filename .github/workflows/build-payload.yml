name: Assemble and sign a distribution delivery
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      image-run:
        type: string
        required: true
    secrets:
      INSTALLER_CATALOG_SIGNING_KEY:
        description: >-
          Resolved from the caller's catalog-signing environment when the secret lives there (the
          environment secret takes precedence over a passed value); callers may also pass it
        required: false
      catalog-signing-key:
        description: Deprecated name kept for callers pinned before the environment split
        required: false
    outputs:
      tag:
        value: ${{ jobs.publish.outputs.tag }}
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  # Assembly runs without any signing credential. It leaves the complete set
  # in a draft release; only the catalog's exact bytes go to the signer.
  payload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      catalog-digest: ${{ steps.draft.outputs.catalog-digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: aurora-silicon/aurora-installer
          ref: b35281a38740d394cfdcef5b06578d1ee2f64bda
          path: producer
          persist-credentials: false
      - name: Authenticate the completed image build
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          IMAGE_RUN: ${{ inputs.image-run }}
        run: |
          [[ $PROFILE =~ ^(fedora|arch|nixos)-(kde|gnome|minimal)$ && $IMAGE_RUN =~ ^[0-9]+$ ]]
          case "$GITHUB_REPOSITORY:$PROFILE" in
            aurora-silicon/fedora-aurora:fedora-*|aurora-silicon/alarm-aurora:arch-*|aurora-silicon/nixos-aurora:nixos-*) ;;
            *) exit 2;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN" > image-build.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo and .path == ".github/workflows/images.yml"' image-build.json
          gh run download "$IMAGE_RUN" --repo "$GITHUB_REPOSITORY" --name "$PROFILE-candidate" --dir downloaded
          # Images built by a workflow that attests must carry valid provenance.
          head=$(jq -r .head_sha image-build.json)
          if gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/images.yml?ref=$head" \
               -H 'Accept: application/vnd.github.raw' | grep -q 'actions/attest-build-provenance'; then
            gh attestation verify "downloaded/out/$PROFILE-filesystems.tar.zst" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/images.yml" --source-digest "$head" \
              --deny-self-hosted-runners
          fi
          sudo apt-get update
          sudo apt-get install -y zstd
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          profile=os.environ['PROFILE'];root=Path('downloaded/out')
          archive=root/(profile+'-filesystems.tar.zst')
          expected=(root/(archive.name+'.sha256')).read_text().split()[0]
          with archive.open('rb') as stream: assert hashlib.file_digest(stream,'sha256').hexdigest()==expected
          PY
          mkdir filesystems
          zstd -dc "downloaded/out/$PROFILE-filesystems.tar.zst" | python3 -c 'import sys,tarfile; tarfile.open(fileobj=sys.stdin.buffer,mode="r|").extractall("filesystems",filter="data")'
          python3 - <<'PY'
          import json,os
          assert json.load(open('filesystems/image.json'))['installation_profile']==os.environ['PROFILE']
          PY
      - name: Verify the signed native runtime inputs
        run: |
          base=https://github.com/aurora-silicon/aurora-installer/releases/download/native-runtime-v0.9.2-aurora.14
          mkdir runtime
          curl -fLsS --retry 3 "$base/runtime-manifest.json" -o runtime/runtime-manifest.json
          curl -fLsS --retry 3 "$base/runtime-manifest.json.sig" -o runtime/runtime-manifest.json.sig
          python3 - <<'PY'
          from pathlib import Path
          key=Path('producer/macOS/Release/trust-root.ed25519.pub').read_bytes();assert len(key)==32
          Path('runtime/public.der').write_bytes(bytes.fromhex('302a300506032b6570032100')+key)
          PY
          openssl pkeyutl -verify -pubin -keyform DER -inkey runtime/public.der -rawin -in runtime/runtime-manifest.json -sigfile runtime/runtime-manifest.json.sig
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          base='https://github.com/aurora-silicon/aurora-installer/releases/download/native-runtime-v0.9.2-aurora.14'
          for name,record in json.load(open('runtime/runtime-manifest.json'))['assets'].items():
              assert Path(name).name==name and record['bytes']<200_000_000
              path=Path('runtime')/name
              subprocess.run(['curl','-fLsS','--retry','3',base+'/'+name,'-o',str(path)],check=True)
              assert path.stat().st_size==record['bytes']
              with path.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==record['sha256']
          PY
          mkdir recovery
          python3 - <<'PY'
          import tarfile
          with tarfile.open('runtime/aurora-recovery-template-alpha1.tar.gz') as archive:archive.extractall('recovery',filter='data')
          PY
      - name: Assemble the common payload and profile catalog
        env:
          PROFILE: ${{ inputs.profile }}
          IMAGE_RUN: ${{ inputs.image-run }}
        run: |
          python3 producer/macOS/scripts/assemble-distribution-payload.py --filesystems filesystems \
            --recovery-app 'recovery/Aurora Installer.app' --output assets --release-id "build-$IMAGE_RUN"
          cp runtime/installer-v0.9.2-aurora.14.tar.gz assets/
          payload="assets/$PROFILE-build-$IMAGE_RUN.zip"
          if (( $(stat -c %s "$payload") >= 1900000000 )); then
            split -b 1073741824 --numeric-suffixes=0 --suffix-length=2 "$payload" "$payload.part"
          fi
          python3 - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          native=Path('producer/macOS');sys.path.insert(0,str(native/'scripts'))
          import supported_models
          models,_=supported_models.load();profile=os.environ['PROFILE'];run=os.environ['IMAGE_RUN']
          lock=json.loads((native/'Engine/source-lock.json').read_text())
          inputs={'installation_profile':profile,'payload_name':profile+'-build-'+run+'.zip',
              'metadata_name':'installer-data-'+profile+'.json','engine_name':lock['validation_artifact']['filename'],
              'engine_version':lock['downstream_overlay']['version'],'evidence_revision':'image-build-'+run,
              'asahi_installer_tag':lock['upstream_installer']['tag'],'asahi_installer_revision':lock['upstream_installer']['commit'],
              'asahi_installer_data_revision':lock['upstream_metadata']['commit'],
              'downstream_revision':subprocess.check_output(['git','-C','producer','rev-parse','HEAD'],text=True).strip(),
              'device_identifiers':models,'installer':{'minimum_version':'0.1.0','latest_version':'0.1.0',
                'download_url':'https://github.com/aurora-silicon/aurora-installer/releases/tag/v0.1.0-alpha.3'}}
          Path('catalog-inputs.json').write_text(json.dumps(inputs,indent=2)+'\n')
          PY
          tag="payload-$PROFILE-$IMAGE_RUN"
          python3 producer/macOS/scripts/make-unsigned-catalog.py --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" \
            --assets-dir assets --inputs catalog-inputs.json --output assets/catalog.json
          cp producer/macOS/Release/trust-root.ed25519.pub assets/
          feed="https://aurorasilicon.org/aurora-distributions/installer/Profiles/$PROFILE"
          bash producer/macOS/scripts/make-release-descriptor --adhoc --public-key assets/trust-root.ed25519.pub \
            --base-url "$feed" --output assets/release.json
          cp image-build.json catalog-inputs.json assets/
      - id: draft
        name: Stage the unsigned delivery as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          IMAGE_RUN: ${{ inputs.image-run }}
        run: |
          set -euo pipefail
          tag="payload-$PROFILE-$IMAGE_RUN"
          payload="assets/$PROFILE-build-$IMAGE_RUN.zip"
          # A multipart catalog pins the whole ZIP even though only its parts ship.
          if [[ -e $payload.part00 ]]; then rm -- "$payload"; fi
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Aurora $PROFILE image build $IMAGE_RUN" --notes 'Staged; awaiting the catalog signature.'
          printf 'tag=%s\ncatalog-digest=%s\n' "$tag" "$(sha256sum assets/catalog.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.profile }}-delivery-record
          path: |
            assets/*.json
            assets/catalog.json.sig
            assets/trust-root.ed25519.pub

  # The catalog key lives in the caller's catalog-signing environment (main
  # only). This job sees nothing but the catalog bytes it signs.
  sign:
    needs: payload
    runs-on: ubuntu-24.04
    environment: catalog-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: aurora-silicon/aurora-installer
          ref: b35281a38740d394cfdcef5b06578d1ee2f64bda
          path: producer
          persist-credentials: false
          sparse-checkout: macOS/Release/trust-root.ed25519.pub
      - name: Sign the exact catalog bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.payload.outputs.tag }}
          DIGEST: ${{ needs.payload.outputs.catalog-digest }}
          CATALOG_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY || secrets.catalog-signing-key }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern catalog.json --dir signing
          echo "$DIGEST  signing/catalog.json" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          key=Path('producer/macOS/Release/trust-root.ed25519.pub').read_bytes();assert len(key)==32
          Path('public.der').write_bytes(bytes.fromhex('302a300506032b6570032100')+key)
          PY
          key="$RUNNER_TEMP/aurora-catalog-key.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$CATALOG_KEY" > "$key"
          openssl pkey -in "$key" -pubout -outform DER -out derived-public.der
          cmp derived-public.der public.der
          openssl pkeyutl -sign -inkey "$key" -rawin -in signing/catalog.json -out signing/catalog.json.sig
          openssl pkeyutl -verify -pubin -keyform DER -inkey public.der -rawin -in signing/catalog.json \
            -sigfile signing/catalog.json.sig
          gh release upload "$TAG" signing/catalog.json.sig --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [payload, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ needs.payload.outputs.tag }}
    steps:
      - name: List the staged assets' digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.payload.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' > SHA256SUMS
          grep -q '  catalog.json.sig$' SHA256SUMS
          awk 'length($1) != 64 { exit 1 }' SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - name: Publish the immutable delivery set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.payload.outputs.tag }}
        run: |
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY"
          notes='Signed development installer delivery for every supported Mac, the MacBook Neo included. The catalog binds the complete payload, parts, metadata and native engine, and every asset carries a GitHub build provenance attestation (SHA256SUMS). No per-Mac firmware, calibration or radio policy is included; the installer derives them on the Mac. Image assembly and physical installation qualification are recorded separately.'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes "$notes"
