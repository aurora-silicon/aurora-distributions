name: Stage the Edge train payloads for every profile
# Artifact-only: no secrets, no release, no catalog signature. Push the train's
# commit A (edge/train.json with the pair, snapshots and image runs) to an
# edge/stage-train-* branch; commit B then records each profile's run and
# STAGING.sha256 digest for the signer.
on:
  push:
    branches: ['edge/stage-train-*']
    paths: [edge/train.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write
concurrency:
  group: edge-train-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile:
          - fedora-kde
          - fedora-gnome
          - fedora-minimal
          - arch-kde
          - arch-gnome
          - arch-minimal
          - nixos-kde
          - nixos-gnome
          - nixos-minimal
          - omarchy-hyprland
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: aurora-silicon/aurora-installer
          ref: 99f180f93e1196a494b2c9a8f6b5989ba8ae1c8b
          path: producer
          persist-credentials: false
      - id: select
        name: Select this profile's train image run
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          import edge_train
          cohort, train = edge_train.load(edge_train.COHORT), edge_train.load(edge_train.TRAIN)
          edge_train.verify_train(train, cohort)
          profile = os.environ['PROFILE']
          producer = json.load(open('producer/macOS/scripts/supported-models.json'))['supported']
          if not set(edge_train.profile_models(cohort, train, profile)) <= set(producer):
              raise ValueError('the pinned producer does not admit every cohort model')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image-run=%d\nrepository=%s\n' % (train['profiles'][profile]['image_run'],
                                                              edge_train.owner(profile)))
          PY
      - name: Authenticate the image archive and its Edge proof
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN: ${{ steps.select.outputs.image-run }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/runs/$IMAGE_RUN" > image-build.json
          jq -e --arg repo "$REPOSITORY" '.conclusion=="success" and .head_branch=="main"
             and .path==".github/workflows/images.yml" and .head_repository.full_name==$repo' image-build.json
          head=$(jq -r .head_sha image-build.json)
          gh api "repos/$REPOSITORY/compare/$head...main" --jq .status | grep -Eqx 'ahead|identical'
          gh run download "$IMAGE_RUN" --repo "$REPOSITORY" --name "$PROFILE-candidate" --dir downloaded
          archive="downloaded/out/$PROFILE-filesystems.tar.zst"
          proof="downloaded/out/$PROFILE-installer/edge-image-proof.json"
          subjects=("$archive" "$proof")
          [[ $PROFILE != omarchy-hyprland ]] || subjects+=(downloaded/out/vm-result.json)
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/images.yml" --source-digest "$head" \
              --deny-self-hosted-runners
          done
          printf '%s  %s\n' "$(cut -d' ' -f1 "$archive.sha256")" "$archive" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir filesystems
          zstd -dc "$archive" | python3 -c 'import sys,tarfile; tarfile.open(fileobj=sys.stdin.buffer,mode="r|").extractall("filesystems",filter="data")'
          cmp "$proof" filesystems/edge-image-proof.json
          cp "$proof" edge-image-proof.json
          jq -e --arg p "$PROFILE" '.installation_profile==$p' filesystems/image.json
      - name: Verify the signed native Recovery template
        run: |
          base=https://github.com/aurora-silicon/aurora-installer/releases/download/native-runtime-v0.9.2-aurora.14
          mkdir runtime
          curl -fLsS --retry 3 "$base/runtime-manifest.json" -o runtime/runtime-manifest.json
          curl -fLsS --retry 3 "$base/runtime-manifest.json.sig" -o runtime/runtime-manifest.json.sig
          python3 - <<'PY'
          from pathlib import Path
          key=Path('producer/macOS/Release/trust-root.ed25519.pub').read_bytes();assert len(key)==32
          Path('runtime/public.der').write_bytes(bytes.fromhex('302a300506032b6570032100')+key)
          PY
          openssl pkeyutl -verify -pubin -keyform DER -inkey runtime/public.der -rawin -in runtime/runtime-manifest.json -sigfile runtime/runtime-manifest.json.sig
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          base='https://github.com/aurora-silicon/aurora-installer/releases/download/native-runtime-v0.9.2-aurora.14'
          name='aurora-recovery-template-alpha1.tar.gz'
          record=json.load(open('runtime/runtime-manifest.json'))['assets'][name]
          assert record['bytes']<200_000_000
          path=Path('runtime')/name
          subprocess.run(['curl','-fLsS','--retry','3',base+'/'+name,'-o',str(path)],check=True)
          assert path.stat().st_size==record['bytes']
          with path.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==record['sha256']
          PY
          mkdir recovery
          python3 - <<'PY'
          import tarfile
          with tarfile.open('runtime/aurora-recovery-template-alpha1.tar.gz') as archive:archive.extractall('recovery',filter='data')
          PY
      - name: Assemble the unsigned train payload template
        run: |
          set -euo pipefail
          python3 scripts/prepare-edge-payload.py --producer producer --filesystems filesystems \
            --recovery 'recovery/Aurora Installer.app' --image-run image-build.json \
            --image-proof edge-image-proof.json --assets assets --profile "$PROFILE"
          [[ $PROFILE != omarchy-hyprland ]] || cp downloaded/out/vm-result.json assets/
          test ! -e assets/catalog.json
          test ! -e assets/edge-qualification.json
          (cd assets && sha256sum -- * > STAGING.sha256)
          printf '%s STAGING.sha256 sha256 %s\n' "$PROFILE" "$(sha256sum assets/STAGING.sha256 | cut -d' ' -f1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/STAGING.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.profile }}-edge-train-stage
          path: assets
          compression-level: 0
          if-no-files-found: error
      # The digest alone, so commit B can record it without the multi-GB stage.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.profile }}-edge-train-staging-sums
          path: assets/STAGING.sha256
          if-no-files-found: error
